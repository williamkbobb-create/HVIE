name: HVIE worker tests

on:
  push:
    branches:
      - feature/standalone-app-foundation
    paths:
      - "worker/**"
      - ".github/workflows/worker-tests.yml"
  pull_request:
    paths:
      - "worker/**"
      - ".github/workflows/worker-tests.yml"

permissions:
  contents: read

jobs:
  intake-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      PYTHONPATH: .
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: worker/requirements.txt
      - name: Install worker dependencies
        run: python -m pip install -r requirements.txt
      - name: Run intake security tests
        run: pytest -q
