name: HVIE worker and COLMAP verification

on:
  push:
    branches:
      - feature/standalone-app-foundation
    paths:
      - "worker/**"
      - ".github/workflows/worker-tests.yml"
  pull_request:
    paths:
      - "worker/**"
      - ".github/workflows/worker-tests.yml"

permissions:
  contents: read

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      PYTHONPATH: .
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: worker/requirements.txt
      - name: Install worker dependencies
        run: python -m pip install -r requirements.txt
      - name: Run intake and runner tests
        run: pytest -q

  colmap-container-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build pinned CPU-only COLMAP image
        run: docker build --tag hvie-colmap-worker:ci ./worker
      - name: Verify COLMAP executable and sparse commands
        run: |
          docker run --rm hvie-colmap-worker:ci colmap -h
          docker run --rm hvie-colmap-worker:ci colmap feature_extractor -h
          docker run --rm hvie-colmap-worker:ci colmap exhaustive_matcher -h
          docker run --rm hvie-colmap-worker:ci colmap mapper -h
      - name: Inspect dense command help (does not validate CUDA execution)
        run: |
          docker run --rm hvie-colmap-worker:ci colmap image_undistorter -h
          docker run --rm hvie-colmap-worker:ci colmap patch_match_stereo -h
          docker run --rm hvie-colmap-worker:ci colmap stereo_fusion -h
          docker run --rm hvie-colmap-worker:ci colmap poisson_mesher -h
      - name: Confirm CPU-only image does not enable dense processing by default
        run: |
          test "$(docker run --rm hvie-colmap-worker:ci python -c 'import os; print(os.getenv("HVIE_ENABLE_DENSE", "0"))')" = "0"
      - name: Verify worker module imports inside image
        run: docker run --rm hvie-colmap-worker:ci python -c "from app.runner import run_one_job; print('HVIE runner import OK')"
